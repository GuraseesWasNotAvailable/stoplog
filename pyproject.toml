[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stoplog"
version = "0.1.0"
description = "Photograph handwritten line-stop sheets; keep a live Google Sheet stop log with loss insights."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.58",
    "anthropic>=2.13",
    "gspread>=6.1",
    "google-auth>=2.30",
    "pillow>=10.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
stoplog = "stoplog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
